# Mirror default branch to github.com/socure-inc/socure-sigmadevice-sdk-ios.
#
# Requires org secret SOCURE_INC_GITHUB_WRITE on this repository.
name: Sync to socure-inc

on:
  workflow_dispatch:

jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    uses: commercial/common-ci-cd-workflows/.github/workflows/global-sync-to-socure-inc-repos.yml@main
    with:
      target_repo: socure-inc/socure-sigmadevice-sdk-ios
    secrets: inherit
